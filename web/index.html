<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Desktop</title>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { display: block; flex: none; box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); }
        canvas[hidden] { display: none; }
        #overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            user-select: none;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: grayscale(100%) brightness(70%);
            -webkit-backdrop-filter: grayscale(100%) brightness(70%);
            animation: fadeIn 0.6s ease-out forwards;
        }
        #overlay[hidden] { display: none; }
        #overlay-title {
            font-size: 24px;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
        }
        #overlay-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
        }
        #reconnect-btn {
            margin-top: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            color: white;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            cursor: pointer;
        }
        #reconnect-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        #reconnect-btn[hidden] { display: none; }
        @keyframes fadeIn {
            from {
                backdrop-filter: grayscale(0%) brightness(100%);
                -webkit-backdrop-filter: grayscale(0%) brightness(100%);
                background: rgba(0, 0, 0, 0);
                opacity: 0;
            }
            to {
                backdrop-filter: grayscale(100%) brightness(55%);
                -webkit-backdrop-filter: grayscale(100%) brightness(55%);
                background: rgba(0, 0, 0, 0.35);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="overlay">
        <div id="overlay-title">Connecting...</div>
        <div id="overlay-subtitle"></div>
        <button id="reconnect-btn" type="button" hidden>Reconnect now</button>
    </div>
    <canvas id="screen" hidden></canvas>
    <script src="keysym.js"></script>
    <script src="app.js"></script>
</body>
</html>
